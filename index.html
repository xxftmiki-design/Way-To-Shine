function shell(content){let d=DATA[group];document.body.innerHTML='<div class="app '+d.theme+'" style="--group-bg:url(\''+d.gradient+'\')"><header class="nav"><button class="nav-brand" onclick="openGroup(\''+group+'\')">WAY TO <b>SHINE</b></button><nav><button class="'+(group==='EDN48'?'selected':'')+'" onclick="openGroup(\'EDN48\')">EDN48</button><button class="'+(group==='TLP48'?'selected':'')+'" onclick="openGroup(\'TLP48\')">TLP48</button><button onclick="accountPage()">ACCOUNT</button></nav><div class="balance"><span>★ '+account.star+'</span><span>◈ '+account.token+'</span><button class="avatar" onclick="accountPage()">'+(account.loggedIn?(account.name||'U')[0].toUpperCase():'U')+'</button></div></header>'+content+'<footer><span>© WAY TO SHINE</span><span>'+d.name+' • '+d.label+'</span></footer></div>'}
function openGroup(g){group=g;let d=DATA[g];let latest=d.latest.map((x,i)=>'<article class="work"><span>0'+(i+1)+'</span><h3>'+x+'</h3><p>'+(i?'OFFICIAL CONTENT':'MUSIC • SINGLE')+'</p></article>').join('');let sch=d.schedule.map(x=>'<div class="schedule-row"><div class="date"><b>'+new Date(x[0]).getDate()+'</b><small>'+new Date(x[0]).toLocaleDateString('en-US',{month:'short'})+'</small></div><div><b>'+x[2]+'</b><p>'+x[1]+' • '+x[3]+'</p></div><button>DETAIL</button></div>').join('');let sp=spark.map((x,i)=>'<div class="spark-row '+(x[0]===g?'current':'')+'"><div class="rank">#'+(i+1)+'</div><div class="spark-avatar">'+x[1][0]+'</div><div class="spark-info"><b>'+x[1]+'</b><small>'+x[0]+'</small></div><div class="votes">'+x[2].toLocaleString()+' <small>VOTES</small></div><button onclick="vote('+i+')">★ VOTE 10</button></div>').join('');let members=d.members.map(m=>'<div class="member-card"><div class="member-photo">'+m[0][0]+'</div><div class="member-main"><b>'+m[0]+'</b><span>'+m[1]+'</span><span>'+m[2]+' YEARS • <a href="https://instagram.com/'+m[3].slice(1)+'" target="_blank">'+m[3]+'</a></span></div><div class="member-actions"><button class="'+(account.oshi.includes(m[0])?'on':'')+'" onclick="oshi(\''+m[0]+'\')">'+(account.oshi.includes(m[0])?'OSHI ✓':'+ OSHI')+'</button><button class="'+(account.kami===m[0]?'kami':'')+'" onclick="kami(\''+m[0]+'\')">✦ KAMI</button></div></div>').join('');let tracks='<div class="track"><button onclick="toast(\'Audio demo ▶\')">▶</button><span>01 — '+(g==='EDN48'?'Shine Again':'Blue Shine')+'</span><small>03:20</small></div><div class="track"><button onclick="toast(\'Audio demo ▶\')">▶</button><span>02 — '+(g==='EDN48'?'Way To Shine':'Bloom With Me')+'</span><small>03:24</small></div>';
let c='<main class="content"><section class="group-hero"><div><p class="eyebrow">'+d.label+'</p><h1>'+d.name+'</h1><p>'+d.tagline+'</p><div class="hero-actions"><button class="primary" onclick="$(\'schedule\').scrollIntoView({behavior:\'smooth\'})">SCHEDULE</button><button class="outline" onclick="$(\'spark\').scrollIntoView({behavior:\'smooth\'})">SPARK OF THE MONTH</button></div></div><div class="hero-banner"><span>NOW SHINING</span><strong>'+d.banner+'</strong><small>'+d.bannerSub+'</small></div></section><section class="section"><div class="section-title"><div><p class="eyebrow">LATEST WORKS</p><h2>ผลงานล่าสุด</h2></div><span class="line"></span></div><div class="release-grid">'+latest+'</div></section><section id="schedule" class="section"><div class="section-title"><div><p class="eyebrow">SCHEDULE</p><h2>ตารางงาน '+g+'</h2></div><span class="line"></span></div><div class="schedule">'+sch+'</div></section><section id="spark" class="section spark-section"><div class="section-title"><div><p class="eyebrow">SPARK OF THE MONTH</p><h2>โหวตดาวประจำเดือน</h2></div><span class="line"></span></div><p class="muted">ใช้ <b>10 STAR</b> ต่อ 1 โหวต • รวมอันดับของ EDN48 และ TLP48 ในระบบเดียวกัน</p><div class="spark-list">'+sp+'</div></section><section class="section two-col"><div><div class="section-title"><div><p class="eyebrow">MEMBERS</p><h2>'+g+' Members</h2></div><span class="line"></span></div><div class="members">'+members+'</div></div><div><div class="section-title"><div><p class="eyebrow">SOCIAL MEDIA</p><h2>Information</h2></div></div><div class="social-box"><p>INSTAGRAM <b>'+d.social[0]+'</b></p><p>X / TWITTER <b>'+d.social[1]+'</b></p><p>YOUTUBE <b>'+d.social[2]+'</b></p><p>OFFICIAL CLUB <b>'+d.label+'</b></p></div><div class="club-box"><b>'+d.label+'</b><p>Redeem code เพื่อรับ TOKEN และสิทธิพิเศษ</p><form onsubmit="redeem(event)"><input id="rc" placeholder="REDEEM CODE"><button class="primary">REDEEM</button></form></div></div></section><section class="section music"><div class="section-title"><div><p class="eyebrow">MUSIC AUDIO</p><h2>เพลงและเสียง</h2></div><span class="line"></span></div><div class="album"><div class="album-art"><span>'+g+'</span><b>1ST<br>SINGLE</b></div><div class="album-info"><span>SINGLE • 2026</span><h2>'+g+' 1st SINGLE</h2>'+tracks+'</div></div></section><section class="section vote-menu"><div><div class="section-title"><div><p class="eyebrow">MENU</p><h2>MAJOR VOTE</h2></div></div><p class="muted">จัดการคะแนน STAR และกิจกรรมโหวตของคุณ</p></div><div class="wallet"><span>STAR</span><b>★ '+account.star+'</b><small>10 STAR / VOTE</small></div><div class="wallet"><span>TOKEN</span><b>◈ '+account.token+'</b><small>ใช้สำหรับของที่ระลึกและสิทธิพิเศษ</small></div></section></main>';shell(c)}
function vote(i){if(account.star<10){toast('STAR ไม่พอสำหรับโหวต');return}account.star-=10;spark[i][2]++;save();openGroup(group);toast('โหวต SPARK OF THE MONTH +1')}
function oshi(n){let i=account.oshi.indexOf(n);if(i>=0)account.oshi.splice(i,1);else account.oshi.push(n);save();openGroup(group);toast(i>=0?'นำออกจาก Oshi แล้ว':'เพิ่มเป็น Oshi แล้ว ✦')}
function kami(n){account.kami=account.kami===n?null:n;save();openGroup(group);toast(account.kami?n+' เป็น Kami Oshi แล้ว ✦':'ยกเลิก Kami Oshi แล้ว')}
function redeem(e){e.preventDefault();if(($('rc').value||'').trim().toUpperCase()==='SHINE2026'){account.token+=500;save();openGroup(group);toast('รับ 500 TOKEN แล้ว ✦')}else toast('REDEEM CODE ไม่ถูกต้อง')}
function accountPage(){document.body.innerHTML='<main class="account-page"><div class="account-top"><button class="back" onclick="openGroup(\''+group+'\')">← APP</button><button class="ghost" onclick="logout()">LOGOUT</button></div><div class="account-head"><div class="account-avatar">'+(account.name?(account.name[0]||'U').toUpperCase():'U')+'</div><div><p class="eyebrow">MY ACCOUNT</p><h1>'+((account.name)||'Shine User')+'</h1><p>'+(account.email||'Demo account')+'</p></div></div><div class="wallet-grid"><div class="wallet big"><span>TOKEN</span><b>◈ '+account.token+'</b><small>สำหรับซื้อของต่างๆ</small></div><div class="wallet big"><span>STAR</span><b>★ '+account.star+'</b><small>สำหรับ SPARK OF THE MONTH</small></div></div><section class="account-section"><p class="eyebrow">MY OSHI</p><h2>Oshi ของฉัน <small>'+account.oshi.length+' คน</small></h2><div class="chips">'+(account.oshi.length?account.oshi.map(x=>'<span>'+x+'</span>').join(''):'<p class="muted">ยังไม่มี Oshi — เลือกจากหน้า Members</p>')+'</div></section><section class="account-section kami-card"><p class="eyebrow">KAMI OSHI</p><h2>✦ '+(account.kami||'ยังไม่ได้เลือก')+'</h2><p class="muted">กด KAMI จากหน้า Members เพื่อเปลี่ยน Kami Oshi</p></section></main>'}
function logout(){account.loggedIn=false;save();welcome();toast('ออกจากระบบแล้ว')}
welcome();
</script></body></html>
